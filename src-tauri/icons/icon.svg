  <!-- Kachel -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#kachel)"/>
  <rect x="48" y="48" width="928" height="928" rx="204" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8"/>
