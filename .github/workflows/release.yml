name: release

on:
  push:
    branches: [main]
  # Probelauf über "Run workflow": baut alle Plattformen, legt kein Release an.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      build: ${{ steps.gate.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: gate
        shell: bash
        run: |
          node scripts/version.ts check
          version=$(node scripts/version.ts get)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag=$(git ls-remote --tags origin "refs/tags/v$version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$tag" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Den Tag v$version gibt es schon, kein Release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS und Linux sind Zusatz: ein Fehlschlag dort hält das Windows-Release nicht auf.
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            optional: false
          - os: macos-latest
            bundles: app,dmg
            optional: true
          # Die vorgebaute ONNX-Runtime (Diktieren über parakeet-rs) braucht glibc 2.38+ und linkt auf 22.04 nicht.
          # Das AppImage läuft nur auf Systemen mit mindestens der glibc dieses Runners.
          - os: ubuntu-24.04
            bundles: appimage,deb
            optional: true
    steps:
      - uses: actions/checkout@v7
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake clang patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Die vorgebaute ONNX-Runtime ruft __isPlatformVersionAtLeast aus der Clang-Laufzeit auf; rustc linkt sie nicht von selbst.
      - name: Clang-Laufzeit für ONNX-Runtime
        if: runner.os == 'macOS'
        shell: bash
        run: echo "RUSTFLAGS=-C link-arg=$(clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a" >> "$GITHUB_ENV"
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      # Die Namen `*-setup.exe` und `*_x64-portable.exe` liest die Update-Funktion des Verwalters
      # (ADR 041) — nicht ändern, ohne `app_update/releases.rs` anzupassen.
      - name: Dateien einsammeln
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          case "$RUNNER_OS" in
            Windows)
              cp "$bundle"/nsis/*-setup.exe out/
              cp src-tauri/target/release/verwalter.exe "out/Agenten-Verwalter-2000_${version}_x64-portable.exe"
              ;;
            macOS)
              cp "$bundle"/dmg/*.dmg out/
              ;;
            Linux)
              cp "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb out/
              ;;
          esac
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: [gate, build]
    if: github.event_name == 'push' && needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ls -l out
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --target "$GITHUB_SHA" --generate-notes out/*
